name: Deploy ML Feature Store to AWS

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  AWS_REGION:  us-east-1
  ACCOUNT_ID:  079755512905
  REGISTRY:    079755512905.dkr.ecr.us-east-1.amazonaws.com

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Unit Tests
  # ─────────────────────────────────────────
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: pytest tests/test_features.py -v

  # ─────────────────────────────────────────
  # JOB 2: Build & Push Docker Images to ECR
  # ─────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    strategy:
      matrix:
        lambda:
          - name: feature-compute
            folder: feature_compute
          - name: feature-serve
            folder: feature_serve
          - name: freshness-monitor
            folder: freshness_monitor
          - name: producer
            folder: producer

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push Docker image
        run: |
          IMAGE_URI=${{ env.REGISTRY }}/feature-store/${{ matrix.lambda.name }}:latest
          docker build -t $IMAGE_URI lambdas/${{ matrix.lambda.folder }}/
          docker push $IMAGE_URI
          echo "Pushed: $IMAGE_URI"

  # ─────────────────────────────────────────
  # JOB 3: Deploy to AWS
  # ─────────────────────────────────────────
  deploy:
    name: Deploy Lambdas to AWS
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ env.AWS_REGION }}

      - name: Provision AWS Infrastructure
        run: |
          bash infrastructure/setup.sh
          bash infrastructure/ecr_setup.sh

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy all Lambdas from ECR images
        run: |
          REGISTRY=${{ env.REGISTRY }}
          ACCOUNT_ID=${{ env.ACCOUNT_ID }}
          REGION=${{ env.AWS_REGION }}
          ROLE_ARN="arn:aws:iam::${ACCOUNT_ID}:role/feature-store-lambda-role"
          COMMON_ENV="AWS_REGION=${REGION},DYNAMODB_TABLE=FeatureStore,S3_BUCKET=feature-store-offline-${ACCOUNT_ID}"

          deploy_lambda() {
            FUNC=$1; IMAGE_URI=$2; MEMORY=$3; TIMEOUT=$4; ENV=$5
            if aws lambda get-function --function-name $FUNC --region $REGION > /dev/null 2>&1; then
              aws lambda update-function-code --function-name $FUNC --image-uri $IMAGE_URI --region $REGION > /dev/null
              echo "Updated: $FUNC"
            else
              aws lambda create-function --function-name $FUNC --package-type Image \
                --code ImageUri=$IMAGE_URI --role $ROLE_ARN \
                --memory-size $MEMORY --timeout $TIMEOUT \
                --environment "Variables={$ENV}" --region $REGION > /dev/null
              echo "Created: $FUNC"
            fi
          }

          deploy_lambda feature-compute   ${REGISTRY}/feature-store/feature-compute:latest   512 30 "${COMMON_ENV}"
          deploy_lambda feature-serve     ${REGISTRY}/feature-store/feature-serve:latest     256 10 "${COMMON_ENV}"
          deploy_lambda freshness-monitor ${REGISTRY}/feature-store/freshness-monitor:latest 128 15 "${COMMON_ENV},STALE_THRESHOLD_SECONDS=300"
          deploy_lambda producer          ${REGISTRY}/feature-store/producer:latest          256 60 "${COMMON_ENV},QUEUE_NAME=feature-store-events"

      - name: Setup CloudWatch alarms
        run: python monitoring/cloudwatch_alarms.py

      - name: Smoke test - invoke producer
        run: |
          aws lambda invoke \
            --function-name producer \
            --payload '{"count": 10}' \
            --cli-binary-format raw-in-base64-out \
            /tmp/producer_response.json
          cat /tmp/producer_response.json
          echo "Smoke test passed!"

      - name: Deployment summary
        run: |
          echo "========================================"
          echo " Deployment successful!"
          echo " Commit : ${{ github.sha }}"
          echo " Images : ECR us-east-1"
          echo " Lambdas: 4 Docker container functions"
          echo "========================================"
